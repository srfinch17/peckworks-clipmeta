name: Release

# Builds the three downloadable assets (clipmeta.mcpb, the unpacked fallback zip, and the
# self-contained CLI zip) and publishes a GitHub Release whenever a version tag (vX.Y.Z) is pushed.
#
# A manual "Run workflow" (workflow_dispatch) builds the SAME assets and uploads them to the run for
# inspection, WITHOUT publishing a release: a safe way to test the build before cutting a real tag.
#
# The release job needs the test job, so nothing publishes (or even builds a dispatch inspection
# artifact) unless the tagged commit's full test suite is green. Mirrors ci.yml's build/test
# invocation so a clip-less runner graceful-skips the real-clip integration tests the same way.
#
# Windows runner is load-bearing: the assets are self-contained win-x64 single-file binaries and
# tools/pack-mcpb.ps1 is PowerShell; the product is Windows-only (see CLAUDE.md "Versioning").

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # create the Release and upload assets

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Definition of Done requires 0 warnings; -warnaserror enforces it so a warning can't creep in.
      - name: Build (Release, warnings = errors)
        run: dotnet build --configuration Release --no-restore -warnaserror

      # Real-clip tests report Inconclusive (skipped) here on a clip-less runner, that does NOT fail
      # the run (testclips/pristine is git-ignored, see ci.yml for the full explanation).
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Proves the MCP server actually spawns and completes the stdio handshake, no clips needed.
      - name: MCP server self-test
        run: dotnet run --project clipmetamcp --configuration Release --no-build -- --selftest

  release:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # VERSION (repo root) is the single canonical version, stamped into every assembly. A tag whose
      # number disagrees with VERSION would publish binaries that self-report a different version, so
      # fail fast. Enforced on tag pushes only (a dispatch test run has no version tag).
      - name: Verify the tag matches VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -ne $tag) {
            throw "tag '$tag' does not match VERSION '$version'. Run tools/bump-version.ps1 and re-tag."
          }
          Write-Host "OK: tag $tag matches VERSION $version"

      # The published release body is .github/release-notes.md, which bump-version.ps1 does NOT
      # stamp, so it silently keeps the PREVIOUS version's notes until hand-edited (v1.1.0 first
      # shipped carrying v1.0.1's notes). Fail before building rather than publish a release whose
      # body describes the wrong version. Not tag-gated, so a workflow_dispatch test build also
      # surfaces stale notes against the current VERSION file.
      - name: Verify release notes mention this version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $notes = Get-Content .github/release-notes.md -Raw
          if ($notes -notmatch [regex]::Escape("v$version")) {
            throw ".github/release-notes.md does not mention 'v$version'. Rewrite its 'What's new' section for this release before tagging (it becomes the published GitHub Release body)."
          }
          Write-Host "OK: release notes mention v$version"

      - name: Build release assets
        shell: pwsh
        run: ./tools/build-release-artifacts.ps1

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            dist/clipmeta.mcpb `
            dist/clipmeta-unpacked.zip `
            dist/clipmeta-cli-win-x64.zip `
            --title "ClipMeta ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md `
            --latest

      - name: Upload assets to the run (test runs only, no release)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: clipmeta-release-assets
          path: |
            dist/clipmeta.mcpb
            dist/clipmeta-unpacked.zip
            dist/clipmeta-cli-win-x64.zip
          if-no-files-found: error
